<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>智能客服 Agent · 中科佳晨</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="root"></div>
  <script>
    /* 混合部署：Firebase Hosting 前端 + 独立 API 后端时，构建期注入 VITE_API_BASE，
       embed.js 读取此全局把 widget 请求指向真实 API（未注入则为空串，走同源默认）。
       注意：Vite 未定义该 env 时会原样保留 %VITE_API_BASE% 字面量，需兜底清空。 */
    window.EMBEDDESK_API_SERVER = "%VITE_API_BASE%";
    if (/%VITE/.test(window.EMBEDDESK_API_SERVER || '')) window.EMBEDDESK_API_SERVER = '';
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
